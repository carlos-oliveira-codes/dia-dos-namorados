<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surpresa da Thayná ❤️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background-color: #ffe6e6; color: #333; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; text-align: center; }
        #start-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: #ffe6e6; z-index: 10000; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .heart-pulse { font-size: 4rem; margin-bottom: 20px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }
        #intro-screen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: #ffe6e6; z-index: 9999; display: none; justify-content: center; align-items: center; }
        .container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        .hidden { display: none !important; }
        button { background-color: #d1476b; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 10px; }
        .error-msg { color: red; font-size: 0.85rem; display: none; }
    </style>
</head>
<body>

    <audio id="bg-music" loop>
        <source src="musica.mp3" type="audio/mpeg">
    </audio>

    <div id="start-overlay">
        <div class="heart-pulse">❤️</div>
        <button onclick="startSurprise()">Clique para começar</button>
    </div>

    <div id="intro-screen"><canvas id="star-canvas"></canvas></div>

    <div id="login-screen" class="container hidden">
        <h1>Acesso Restrito 🔐</h1>
        <input type="text" id="password-input" placeholder="Apelido...">
        <p id="login-error" class="error-msg">Apelido incorreto!</p>
        <button onclick="checkPassword()">Entrar</button>
    </div>

    <div id="hunt-screen" class="container hidden">
        <h1 id="item-subtitle">Caça Creamy</h1>
        <p id="item-question"></p>
        <p id="item-location" class="hidden" style="background:#fff0f3; padding:10px;"></p>
        <button id="btn-acertou" onclick="showLocation()">Acertou! ✨</button>
        <button id="btn-achei" class="hidden" onclick="nextItem()">Já achei! 🎯</button>
    </div>

    <div id="puzzle-screen" class="container hidden">
        <h1>Tudo Encontrado! 🧩</h1>
        <input type="text" id="phrase-input" placeholder="Digite a mensagem...">
        <p id="phrase-error" class="error-msg">Mensagem incorreta!</p>
        <button onclick="checkPhrase()">Desbloquear Final</button>
    </div>

    <div id="error-screen" class="container hidden" style="background:#ffcccc; padding:20px; border-radius:10px;">
        <h1>⚠️ SYSTEM ERROR ⚠️</h1>
        <p>Vire para trás!</p>
    </div>

    <script>
        const canvas = document.getElementById('star-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        
        let animationId;

        function startSurprise() {
            const audio = document.getElementById("bg-music");
            audio.play().catch(e => console.log(e));
            document.getElementById('start-overlay').style.display = 'none';
            document.getElementById('intro-screen').style.display = 'flex';
            animateIntro();
        }

        function animateIntro() {
            // Animação simplificada para garantir funcionamento
            ctx.fillStyle = '#d1476b';
            ctx.font = '50px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('Thayná', canvas.width/2, canvas.height/2);
            
            setTimeout(() => {
                document.getElementById('intro-screen').style.display = 'none';
                document.getElementById('login-screen').classList.remove('hidden');
            }, 5000);
        }

        function fadeOutAudio() {
            const audio = document.getElementById("bg-music");
            let vol = audio.volume;
            let fade = setInterval(() => {
                if (vol > 0.05) { vol -= 0.05; audio.volume = vol; } 
                else { audio.pause(); clearInterval(fade); }
            }, 100);
        }

        function checkPassword() {
            if(document.getElementById("password-input").value.toLowerCase() === "lilinho") {
                fadeOutAudio();
                document.getElementById("login-screen").classList.add("hidden");
                document.getElementById("hunt-screen").classList.remove("hidden");
                loadItem();
            } else { document.getElementById("login-error").style.display = "block"; }
        }

        const items = [
            { title: "Item 1", q: "Lanche favorito?", loc: "Debaixo do dispositivo de jogo." },
            { title: "Item 2", q: "Primeiro ursinho?", loc: "Dentro do ursinho." },
            { title: "Item 3", q: "Matemática ou Português?", loc: "Na caixa de sapato." },
            { title: "Item 4", q: "Onde pega a escova?", loc: "Onde pega a escova." }
        ];

        let index = 0;
        function loadItem() {
            document.getElementById("item-subtitle").innerText = items[index].title;
            document.getElementById("item-question").innerText = items[index].q;
            document.getElementById("item-location").innerText = items[index].loc;
        }

        function showLocation() {
            document.getElementById("btn-acertou").classList.add("hidden");
            document.getElementById("item-location").classList.remove("hidden");
            document.getElementById("btn-achei").classList.remove("hidden");
        }

        function nextItem() {
            index++;
            if(index < items.length) { loadItem(); document.getElementById("btn-achei").classList.add("hidden"); document.getElementById("btn-acertou").classList.remove("hidden"); document.getElementById("item-location").classList.add("hidden"); }
            else { document.getElementById("hunt-screen").classList.add("hidden"); document.getElementById("puzzle-screen").classList.remove("hidden"); }
        }

        function checkPhrase() {
            if(document.getElementById("phrase-input").value.toLowerCase() === "eu te amo") {
                document.getElementById("puzzle-screen").classList.add("hidden");
                document.getElementById("error-screen").classList.remove("hidden");
            } else { document.getElementById("phrase-error").style.display = "block"; }
        }
    </script>
</body>
</html>
